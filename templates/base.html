<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{% block title %}Account{% endblock %} · Secure Auth</title>
<script src="https://cdn.tailwindcss.com"></script>
<style type="text/tailwindcss">
  @layer components {
    .inp { @apply w-full px-4 py-3 rounded-lg bg-slate-100 border border-transparent focus:border-blue-500 focus:bg-white outline-none text-sm; }
    .btn { @apply w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition disabled:opacity-60; }
    .btn-alt { @apply w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-lg transition; }
  }
</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
<main class="bg-white shadow-xl rounded-2xl w-full {% block width %}max-w-md{% endblock %} p-8">
{% block body %}{% endblock %}
</main>
<script>
const CSRF = document.querySelector('meta[name=csrf-token]').content;
async function api(url, body) {
  try {
    const r = await fetch(url, {method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json','X-CSRFToken':CSRF}, body:JSON.stringify(body||{})});
    const d = await r.json().catch(() => ({}));
    return {...d, ok: r.ok && d.success !== false};
  } catch (e) { return {ok:false, message:'Network error. Please try again.'}; }
}
function show(text, ok) {
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'text-sm text-center mt-4 ' + (ok ? 'text-green-600' : 'text-red-600');
}
function busy(btn, on, label) { btn.disabled = on; btn.textContent = on ? 'Please wait…' : label; }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
